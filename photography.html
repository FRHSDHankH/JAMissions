<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Photography — Jalyn Anderson Mission Documentary Work" />
  <meta property="og:title" content="Photography | Jalyn Anderson" />
  <title>Photography | Jalyn Anderson</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>J</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div id="site-nav"></div>

  <main id="photos-app">

    <header class="photos-header text-center">
      <span class="label-badge">Photography</span>
    </header>

    <div class="toggle-wrap text-center mb-2">
      <button class="toggle-btn" :class="{ active: viewMode === 'grid' }" @click="switchMode('grid')">⊞ Grid</button>
      <button class="toggle-btn" :class="{ active: viewMode === 'carousel' }" @click="switchMode('carousel')">▷ Carousel</button>
    </div>

    <!-- ─── GRID VIEW ─────────────────────────────────────────── -->
    <section v-if="viewMode === 'grid'" class="photos-wall pb-5">

      <!-- Rendered rows (only visibleCount photos shown) -->
      <div
        v-for="(row, rowIndex) in visibleRows"
        :key="'row-' + rowIndex"
        class="photo-row"
        :class="'row-count-' + row.length"
      >
        <div
          v-for="(photo, colIndex) in row"
          :key="'photo-' + photo.id"
          class="photo-row-item fade-up"
          :style="{ transitionDelay: (colIndex * 0.05) + 's', transform: 'rotate(' + getRotation(photo.id) + 'deg)' }"
          @click="openLightbox(photo)"
        >
          <div class="square-polaroid">
            <img :src="photo.src" :alt="photo.alt" loading="lazy" />
          </div>
        </div>
      </div>



    </section>

    <!-- ─── CAROUSEL VIEW ─────────────────────────────────────── -->
    <section v-if="viewMode === 'carousel'" class="photos-carousel-section pb-5">
      <div class="carousel-stage">
        <button class="carousel-arrow carousel-arrow-left" @click="prev">←</button>
        <div class="carousel-img-wrap">
          <transition :name="slideDirection === 'forward' ? 'slide-forward' : 'slide-back'" mode="out-in">
            <div
              :key="currentIndex"
              class="carousel-polaroid"
              @click="openLightbox(photos[currentIndex])"
              style="cursor:zoom-in;"
            >
              <img
                :src="photos[currentIndex].src"
                :alt="photos[currentIndex].alt"
                class="carousel-img"
              />
            </div>
          </transition>
        </div>
        <button class="carousel-arrow carousel-arrow-right" @click="next">→</button>
      </div>
      <div class="text-center mt-4">
        <p class="label-text mb-1">
          {{ String(currentIndex + 1).padStart(2, '0') }} / {{ String(photos.length).padStart(2, '0') }}
        </p>
        <p class="label-text" style="color: var(--accent);">{{ photos[currentIndex].mission }}</p>
      </div>
      <div class="carousel-dots mt-3">
        <span
          v-for="(photo, i) in photos"
          :key="'dot-' + i"
          class="carousel-dot"
          :class="{ active: i === currentIndex }"
          @click="currentIndex = i"
        ></span>
      </div>
    </section>

    <div v-if="photos.length === 0" class="text-center py-5">
      <p class="label-text">Loading photos...</p>
    </div>

    <!-- ─── LIGHTBOX ──────────────────────────────────────────── -->
    <transition name="lb-fade">
      <div v-if="lightbox" class="lightbox" @click.self="closeLightbox">
        <button class="lb-close" @click="closeLightbox">✕</button>
        <button class="lb-arrow lb-arrow-left" @click="lightboxPrev">←</button>
        <div class="lb-img-wrap">
          <img
            v-if="!lightboxLoading"
            :src="lightboxPhoto.fullSrc"
            :alt="lightboxPhoto.alt"
            class="lb-img"
          />
          <div v-else class="lb-spinner">
            <div class="spinner"></div>
          </div>
        </div>
        <button class="lb-arrow lb-arrow-right" @click="lightboxNext">→</button>
        <p class="lb-caption label-text">
          {{ lightboxPhoto.mission }} &nbsp;·&nbsp;
          {{ String(lightboxIndex + 1).padStart(2, '0') }} / {{ String(photos.length).padStart(2, '0') }}
        </p>
      </div>
    </transition>

  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="js/main.js"></script>
  <script>
    const { createApp } = Vue;

    const ROW_PATTERN = [4, 3, 5, 3, 4, 5, 3, 4, 3, 5, 4, 3, 5, 4, 3];
    const ROTATIONS  = [-1.8, 0.7, -0.4, 1.5, -1.1, 0.9, -1.6, 0.3,
                         1.2, -0.6, 1.8, -0.9, 0.5, -1.4, 1.0, -0.3,
                         1.6, -1.2, 0.8, -1.7, 0.4, -0.7, 1.3, -0.5];


    createApp({
      data() {
        return {
          photos:         [],
          viewMode:       'grid',
          currentIndex:   0,
          slideDirection: 'forward',
          visibleCount:   9999,
          // lightbox
          lightbox:       false,
          lightboxIndex:  0,
          lightboxLoading: false,
        };
      },
      computed: {
        visiblePhotos() {
          return this.photos;
        },
        visibleRows() {
          const rows = [];
          let i = 0, p = 0;
          while (i < this.visiblePhotos.length) {
            const count = ROW_PATTERN[p % ROW_PATTERN.length];
            rows.push(this.visiblePhotos.slice(i, i + count));
            i += count; p++;
          }
          return rows;
        },
        lightboxPhoto() {
          return this.photos[this.lightboxIndex] || {};
        }
      },
      async mounted() {
        try {
          const res = await fetch('data/photos.json');
          this.photos = await res.json();
        } catch(e) { console.warn('Could not load photos.json'); }

        this.$nextTick(() => {
          if (window.initFadeUp) window.initFadeUp();

        });

        // Keyboard navigation
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') this.closeLightbox();
          // Lightbox arrows
          if (e.key === 'ArrowRight' && this.lightbox) { this.lightboxNext(); return; }
          if (e.key === 'ArrowLeft'  && this.lightbox) { this.lightboxPrev(); return; }
          // Main carousel arrows + spacebar (when not in lightbox)
          if (!this.lightbox && this.viewMode === 'carousel') {
            if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); this.next(); }
            if (e.key === 'ArrowLeft')  { this.prev(); }
          }
        });
      },
      methods: {
        getRotation(id) {
          return ROTATIONS[(id - 1) % ROTATIONS.length];
        },
        switchMode(mode) {
          this.viewMode = mode;
          if (mode === 'carousel') this.currentIndex = 0;
          if (mode === 'grid') {
            this.$nextTick(() => {
              if (window.initFadeUp) window.initFadeUp();
    
            });
          }
        },
        prev() {
          this.slideDirection = 'back';
          this.currentIndex = (this.currentIndex - 1 + this.photos.length) % this.photos.length;
        },
        next() {
          this.slideDirection = 'forward';
          this.currentIndex = (this.currentIndex + 1) % this.photos.length;
        },

        // ── Infinite scroll ──
        initInfiniteScroll() {
          const trigger = document.getElementById('load-more-trigger');
          if (!trigger) return;
          const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting) {
              this.loadMore();
            }
          }, { threshold: 0.1 });
          observer.observe(trigger);
        },
        loadMore() {
          if (this.visibleCount >= this.photos.length) return;
          this.visibleCount = Math.min(this.visibleCount + BATCH, this.photos.length);
          this.$nextTick(() => {
            if (window.initFadeUp) window.initFadeUp();
   // re-observe new trigger position
          });
        },

        // ── Lightbox ──
        openLightbox(photo) {
          this.lightboxIndex  = this.photos.findIndex(p => p.id === photo.id);
          this.lightboxLoading = true;
          this.lightbox        = true;
          document.body.style.overflow = 'hidden';
          // Preload full jpg
          const img = new Image();
          img.onload = () => { this.lightboxLoading = false; };
          img.src = photo.fullSrc;
        },
        closeLightbox() {
          this.lightbox = false;
          document.body.style.overflow = '';
        },
        lightboxNext() {
          this.slideDirection = 'forward';
          this.lightboxIndex = (this.lightboxIndex + 1) % this.photos.length;
          this.lightboxLoading = true;
          const img = new Image();
          img.onload = () => { this.lightboxLoading = false; };
          img.src = this.lightboxPhoto.fullSrc;
        },
        lightboxPrev() {
          this.slideDirection = 'back';
          this.lightboxIndex = (this.lightboxIndex - 1 + this.photos.length) % this.photos.length;
          this.lightboxLoading = true;
          const img = new Image();
          img.onload = () => { this.lightboxLoading = false; };
          img.src = this.lightboxPhoto.fullSrc;
        }
      }
    }).mount('#photos-app');
  </script>

  <style>
    .photos-header { padding: 2.5rem 1rem 1.2rem; background: var(--bg-primary); }

    .toggle-wrap {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      padding: 0 1rem 1.5rem;
    }
    .toggle-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: var(--font-label);
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 0.4rem 1.2rem;
      cursor: pointer;
      transition: color 0.25s, border-color 0.25s;
    }
    .toggle-btn.active { color: var(--accent); border-color: var(--accent); }
    .toggle-btn:hover:not(.active) { color: var(--text-primary); border-color: var(--text-primary); }

    /* ── Wall grid ── */
    .photos-wall { padding: 0 2rem; max-width: 1200px; margin: 0 auto; }
    .photo-row { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
    .row-count-3 .photo-row-item { width: calc((100% - 40px) / 3); }
    .row-count-4 .photo-row-item { width: calc((100% - 60px) / 4); }
    .row-count-5 .photo-row-item { width: calc((100% - 80px) / 5); }

    .photo-row-item {
      transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.5s ease;
      cursor: zoom-in;
    }
    .photo-row-item:hover {
      transform: rotate(0deg) scale(1.05) translateY(-5px) !important;
      z-index: 10;
      position: relative;
    }

    .square-polaroid {
      background: #1c1c1c;
      border: 1px solid #2a2a2a;
      padding: 8px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.65);
      transition: box-shadow 0.3s ease;
    }
    .square-polaroid img {
      width: 100%;
      aspect-ratio: 1/1;
      object-fit: cover;
      display: block;
    }
    .photo-row-item:hover .square-polaroid {
      box-shadow: 0 10px 35px rgba(0,0,0,0.85);
    }



    /* ── Carousel ── */
    .photos-carousel-section { width: 100%; }
    .carousel-stage {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 3.5rem;
    }
    .carousel-img-wrap {
      position: relative;
      width: 100%;
      height: 520px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-card);
    }
    .carousel-img { max-width: 100%; max-height: 520px; object-fit: contain; display: block; }
    .carousel-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 1rem;
      width: 40px;
      height: 40px;
      cursor: pointer;
      z-index: 10;
      transition: background 0.25s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .carousel-arrow:hover { background: var(--text-primary); color: var(--bg-primary); }
    .carousel-arrow-left  { left: 0; }
    .carousel-arrow-right { right: 0; }
    .carousel-dots { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; padding: 0 2rem; }
    .carousel-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border); cursor: pointer; transition: background 0.25s, transform 0.25s; }
    .carousel-dot.active { background: var(--accent); transform: scale(1.4); }
    .slide-fade-enter-active, .slide-fade-leave-active { transition: opacity 0.35s ease, transform 0.35s ease; position: relative !important; }
    .slide-fade-enter-from { opacity: 0; transform: translateX(40px); }
    .slide-fade-leave-to   { opacity: 0; transform: translateX(-40px); }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 9000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .lb-img-wrap {
      max-width: 90vw;
      max-height: 88vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .lb-img {
      max-width: 90vw;
      max-height: 88vh;
      object-fit: contain;
      display: block;
      box-shadow: 0 0 60px rgba(0,0,0,0.8);
    }
    .lb-close {
      position: fixed;
      top: 1.2rem;
      right: 1.5rem;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--text-primary);
      font-size: 1rem;
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 9001;
    }
    .lb-close:hover { background: rgba(255,255,255,0.1); }
    .lb-arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--text-primary);
      font-size: 1.2rem;
      width: 44px;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 9001;
    }
    .lb-arrow:hover { background: rgba(255,255,255,0.1); }
    .lb-arrow-left  { left: 1rem; }
    .lb-arrow-right { right: 1rem; }
    .lb-caption {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      color: var(--text-muted);
      letter-spacing: 0.15em;
      font-size: 0.65rem;
      z-index: 9001;
    }

    /* Spinner */
    .lb-spinner { display: flex; align-items: center; justify-content: center; width: 80px; height: 80px; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Lightbox fade */
    .lb-fade-enter-active, .lb-fade-leave-active { transition: opacity 0.25s ease; }
    .lb-fade-enter-from, .lb-fade-leave-to { opacity: 0; }

    /* Responsive */
    @media (max-width: 900px) { .row-count-5 .photo-row-item { width: calc((100% - 60px) / 4); } }
    @media (max-width: 680px) {
      .photos-wall { padding: 0 1rem; }
      .photo-row { gap: 10px; margin-bottom: 10px; }
      .row-count-3 .photo-row-item,
      .row-count-4 .photo-row-item,
      .row-count-5 .photo-row-item { width: calc((100% - 20px) / 3); }
      .photo-row-item:hover { transform: none !important; }
      .carousel-stage { padding: 0 2.5rem; }
      .carousel-img-wrap { min-height: 260px; }
      .lb-arrow-left  { left: 0.3rem; }
      .lb-arrow-right { right: 0.3rem; }
    }
    @media (max-width: 420px) {
      .row-count-3 .photo-row-item,
      .row-count-4 .photo-row-item,
      .row-count-5 .photo-row-item { width: calc((100% - 10px) / 2); }
    }
  </style>

</body>
</html>
